<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Car Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen flex flex-col items-center p-8">
  <!-- Car Inventory Section -->
  <div id="carSection" class="w-full max-w-5xl bg-white shadow-md rounded-lg p-6 hidden">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-semibold text-gray-700">Car Inventory</h1>
      <div>
        <button
          onclick="openCreateModal()"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 mr-2"
        >
          Add Car
        </button>
        <button
          onclick="logout()"
          class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700"
        >
          Logout
        </button>
      </div>
    </div>

    <table class="w-full border-collapse">
      <thead class="bg-gray-200">
        <tr>
          <th class="p-2 border">No.</th>
          <th class="p-2 border">Make</th>
          <th class="p-2 border">Model</th>
          <th class="p-2 border">Year</th>
          <th class="p-2 border">Color</th>
          <th class="p-2 border">Body Type</th>
          <th class="p-2 border">Engine Type</th>
          <th class="p-2 border">Actions</th>
        </tr>
      </thead>
      <tbody id="carTableBody"></tbody>
    </table>
  </div>

  <!-- Modal -->
  <div id="carModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center">
    <div class="bg-white rounded-lg w-96 p-6">
      <h2 id="modalTitle" class="text-xl font-semibold mb-4"></h2>
      <form id="carForm" onsubmit="saveCar(event)">
        <input type="hidden" id="carId" />
        <div class="mb-2">
          <label class="block text-gray-700">Make</label>
          <input id="carMake" class="border p-2 w-full rounded" required />
        </div>
        <div class="mb-2">
          <label class="block text-gray-700">Model</label>
          <input id="carModel" class="border p-2 w-full rounded" required />
        </div>
        <div class="mb-2">
          <label class="block text-gray-700">Year</label>
          <input id="carYear" type="number" class="border p-2 w-full rounded" required />
        </div>
        <div class="mb-2">
          <label class="block text-gray-700">Color</label>
          <input id="carColor" class="border p-2 w-full rounded" required />
        </div>
        <div class="mb-2">
          <label class="block text-gray-700">Body Type</label>
          <input id="carBodyType" class="border p-2 w-full rounded" required />
        </div>
        <div class="mb-2">
          <label class="block text-gray-700">Engine Type</label>
          <input id="carEngineType" class="border p-2 w-full rounded" required />
        </div>
        <div class="flex justify-end mt-4 space-x-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
            Cancel
          </button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
            Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Login Section -->
  <section id="loginSection" class="w-full max-w-md mt-12 p-6 bg-white rounded-lg shadow-md" aria-label="Login Form">
    <h2 class="text-2xl font-semibold mb-6 text-gray-700">Login</h2>
    <form id="loginForm" class="space-y-5">
      <input
        id="username"
        type="text"
        placeholder="Username"
        class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      />
      <input
        id="password"
        type="password"
        placeholder="Password"
        class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      />
      <button
        id="loginBtn"
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-md transition"
      >
        Login
      </button>
    </form>
  </section>

  <script src="js/script.js"></script>
</body>

</html>
