<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Car Inventory using React</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body class="bg-gray-50 min-h-screen flex flex-col items-center p-8">
    <div id="root" class="w-full"></div>

    <script type="text/babel">
      const apiBase = "http://localhost:8080/api/cars";
      const loginUrl = "http://localhost:8080/api/auth/login";

      function App() {
        const [cars, setCars] = React.useState([]);
        const [token, setToken] = React.useState(
          localStorage.getItem("jwtToken") || ""
        );
        const [showModal, setShowModal] = React.useState(false);
        const [editingCar, setEditingCar] = React.useState(null);
        const [form, setForm] = React.useState({
          make: "",
          model: "",
          year: "",
          color: "",
          bodyType: "",
          engineType: "",
          licensePlate: "",
        });
        const [showLogin, setShowLogin] = React.useState(false);
        const [loginForm, setLoginForm] = React.useState({
          username: "",
          password: "",
        });

        React.useEffect(() => {
          if (token) fetchCars();
        }, [token]);

        function fetchCars() {
          fetch(apiBase, { headers: { Authorization: `Bearer ${token}` } })
            .then((res) => res.json())
            .then(setCars)
            .catch(console.error);
        }

        function openCreateModal() {
          setEditingCar(null);
          setForm({
            make: "",
            model: "",
            year: "",
            color: "",
            bodyType: "",
            engineType: "",
            licensePlate: "",
          });
          setShowModal(true);
        }

        function openEditModal(car) {
          setEditingCar(car);
          setForm({
            make: car.make,
            model: car.model,
            year: car.year,
            color: car.color,
            bodyType: car.bodyType,
            engineType: car.engineType,
            licensePlate: car.licensePlate,
          });
          setShowModal(true);
        }

        function closeModal() {
          setShowModal(false);
        }

        function handleChange(e) {
          const { id, value } = e.target;
          setForm((prev) => ({ ...prev, [id]: value }));
        }

        function handleLoginChange(e) {
          const { id, value } = e.target;
          setLoginForm((prev) => ({ ...prev, [id]: value }));
        }

        function saveCar(e) {
          e.preventDefault();
          const method = editingCar ? "PUT" : "POST";
          const url = editingCar ? `${apiBase}/${editingCar.id}` : apiBase;

          fetch(url, {
            method,
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify(form),
          })
            .then((res) => {
              if (!res.ok) throw new Error("Save failed");
              return res.json();
            })
            .then(() => {
              closeModal();
              fetchCars();
            })
            .catch(console.error);
        }

        function deleteCar(id) {
          if (!confirm("Delete this car?")) return;
          fetch(`${apiBase}/${id}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` },
          })
            .then(() => fetchCars())
            .catch(console.error);
        }

        function loginUser(e) {
          e.preventDefault();
          fetch(loginUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(loginForm),
          })
            .then((res) => {
              if (!res.ok) throw new Error("Invalid credentials");
              return res.json();
            })
            .then((data) => {
              localStorage.setItem("jwtToken", data.token);
              setToken(data.token);
              setShowLogin(false);
              fetchCars();
            })
            .catch(() => alert("Login failed. Check credentials."));
        }

        function logout() {
          localStorage.removeItem("jwtToken");
          setToken("");
          setCars([]);
        }

        if (!token) {
          return (
            <div className="bg-white shadow-md rounded-lg p-6 w-full max-w-md text-center m-auto">
              <h1 className="text-2xl font-semibold text-gray-700 mb-4">
                Car Inventory
              </h1>
              <p className="text-gray-600 mb-4">
                Please log in to access the system.
              </p>
              <button
                onClick={() => setShowLogin(true)}
                className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
              >
                Log In
              </button>

              {showLogin && (
                <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center">
                  <div className="bg-white rounded-lg w-96 p-6">
                    <h2 className="text-xl font-semibold mb-4">User Login</h2>
                    <form onSubmit={loginUser}>
                      <div className="mb-3">
                        <label className="block text-gray-700 mb-1">
                          Username
                        </label>
                        <input
                          id="username"
                          value={loginForm.username}
                          onChange={handleLoginChange}
                          className="border p-2 w-full rounded"
                          required
                        />
                      </div>
                      <div className="mb-3">
                        <label className="block text-gray-700 mb-1">
                          Password
                        </label>
                        <input
                          id="password"
                          type="password"
                          value={loginForm.password}
                          onChange={handleLoginChange}
                          className="border p-2 w-full rounded"
                          required
                        />
                      </div>
                      <div className="flex justify-end mt-4 space-x-2">
                        <button
                          type="button"
                          onClick={() => setShowLogin(false)}
                          className="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400"
                        >
                          Cancel
                        </button>
                        <button
                          type="submit"
                          className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
                        >
                          Login
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        return (
          <div className="w-full max-w-6xl bg-white shadow-md rounded-lg p-6 m-auto">
            <div className="flex justify-between items-center mb-4">
              <h1 className="text-2xl font-semibold text-gray-700">
                Car Inventory
              </h1>
              <div className="space-x-2">
                <button
                  onClick={openCreateModal}
                  className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
                >
                  Add Car
                </button>
                <button
                  onClick={logout}
                  className="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600"
                >
                  Logout
                </button>
              </div>
            </div>

            <div className="flex align-middle justify-center">
              <div className="overflow-x-auto">
                <table className="min-w-full border-collapse">
                  <thead className="bg-gray-200 text-gray-700">
                    <tr>
                      <th className="p-2 border text-center">No.</th>
                      <th className="p-2 border text-left">Make</th>
                      <th className="p-2 border text-left">Model</th>
                      <th className="p-2 border text-center">Year</th>
                      <th className="p-2 border text-left">Color</th>
                      <th className="p-2 border text-left">Body Type</th>
                      <th className="p-2 border text-left">Engine Type</th>
                      <th className="p-2 border text-left">License Plate</th>
                      <th className="p-2 border text-center">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {cars.map((car, index) => (
                      <tr key={car.id} className="text-gray-700">
                        <td className="border p-2 text-center">{index + 1}</td>
                        <td className="border p-2 text-left">{car.make}</td>
                        <td className="border p-2 text-left">{car.model}</td>
                        <td className="border p-2 text-center">{car.year}</td>
                        <td className="border p-2 text-left">{car.color}</td>
                        <td className="border p-2 text-left">{car.bodyType}</td>
                        <td className="border p-2 text-left">
                          {car.engineType}
                        </td>
                        <td className="border p-2 text-left">
                          {car.licensePlate}
                        </td>
                        <td className="border p-2 text-center space-x-2">
                          <button
                            onClick={() => openEditModal(car)}
                            className="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600"
                          >
                            Edit
                          </button>
                          <button
                            onClick={() => deleteCar(car.id)}
                            className="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600"
                          >
                            Delete
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {showModal && (
              <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center">
                <div className="bg-white rounded-lg w-96 p-6">
                  <h2 className="text-xl font-semibold mb-4">
                    {editingCar ? "Edit Car" : "Add Car"}
                  </h2>
                  <form onSubmit={saveCar}>
                    {[
                      "make",
                      "model",
                      "year",
                      "color",
                      "bodyType",
                      "engineType",
                      "licensePlate",
                    ].map((field) => (
                      <div key={field} className="mb-3">
                        <label className="block text-gray-700 mb-1">
                          {field.charAt(0).toUpperCase() + field.slice(1)}
                        </label>
                        <input
                          id={field}
                          type={field === "year" ? "number" : "text"}
                          value={form[field]}
                          onChange={handleChange}
                          className="border p-2 w-full rounded"
                          required
                        />
                      </div>
                    ))}
                    <div className="flex justify-end mt-4 space-x-2">
                      <button
                        type="button"
                        onClick={closeModal}
                        className="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
                      >
                        Save
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
